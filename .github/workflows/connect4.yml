name: Connect 4 Profile Game

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'connect4|') || startsWith(github.event.issue.title, 'Connect Four') || startsWith(github.event.issue.title, 'connect four')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Process Move & Update Board
        id: engine
        run: |
          node .github/scripts/connect4.js --title "${{ github.event.issue.title }}" --user "${{ github.event.issue.user.login }}"

      - name: Commit and Push Game State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/connect4_board.svg state/connect4.json
          git diff --staged --quiet || git commit -m "🎮 Update Connect 4 board [@${{ github.event.issue.user.login }}]"
          git push

      - name: Reply and Close Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const state = JSON.parse(fs.readFileSync('state/connect4.json', 'utf8'));
            let status = 'Turn: Human (Cyan)';
            if (state.status === 'finished') {
              if (state.winner === 1) status = '🎉 Winner: Human (Cyan)!';
              else if (state.winner === 2) status = '👾 Winner: CyberBot (AI)!';
              else status = '🤝 Game ended in a Draw!';
            }

            const body = `### 🎮 Connect 4 Move Processed!
            
**Player:** @${context.payload.issue.user.login}
**Action:** \`${context.payload.issue.title}\`
**Status:** ${status}

[View Updated Board on Profile](https://github.com/NourSalous#connect4-arcade) · [Open Web Arcade](https://noursalous.github.io/NourSalous/playground/#connect4)

Thanks for playing!`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: body
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed'
            });
