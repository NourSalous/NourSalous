name: Deploy Contribution Skyline to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'skyline/**'
      - '.github/workflows/deploy-skyline.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-skyline
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skyline/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: skyline

      - name: Build
        run: npm run build
        working-directory: skyline

      - name: Deploy to gh-pages (skyline/)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: skyline/dist
          target-folder: skyline
          clean: false
