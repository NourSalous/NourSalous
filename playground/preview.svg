  <rect x="16" y="20" width="608" height="384" rx="26" fill="url(#plinth)" stroke="#3a3a6a" stroke-width="1.5"/>

  <circle cx="300" cy="225" r="164" fill="url(#platter)" stroke="#2a2a5a" stroke-width="2"/>
  <circle cx="300" cy="225" r="160" fill="none" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" filter="url(#neon)"/>
  <circle cx="300" cy="225" r="152" fill="url(#vinyl)"/>
  <g fill="none" stroke="#15151f" stroke-width="1">
