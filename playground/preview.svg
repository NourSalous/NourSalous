    <circle cx="300" cy="225" r="128"/><circle cx="300" cy="225" r="122"/><circle cx="300" cy="225" r="116"/>
    <circle cx="300" cy="225" r="110"/><circle cx="300" cy="225" r="104"/><circle cx="300" cy="225" r="98"/>
    <circle cx="300" cy="225" r="92"/><circle cx="300" cy="225" r="86"/><circle cx="300" cy="225" r="80"/>
    <circle cx="300" cy="225" r="74"/><circle cx="300" cy="225" r="68"/><circle cx="300" cy="225" r="62"/>
  </g>
