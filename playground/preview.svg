  <circle cx="300" cy="225" r="48" fill="url(#label)" filter="url(#neon)"/>
  <text x="300" y="210" text-anchor="middle" font-family="Orbitron,sans-serif" font-weight="800" font-size="13" fill="#0a0a12" letter-spacing="2">NOUR</text>
  <text x="300" y="226" text-anchor="middle" font-family="Orbitron,sans-serif" font-size="5.5" fill="#0a0a12" letter-spacing="1">NEON DRIVE</text>
  <text x="300" y="240" text-anchor="middle" font-family="Orbitron,sans-serif" font-size="6" fill="#0a0a12" letter-spacing="0.5">33⅓ RPM · CYBER</text>
