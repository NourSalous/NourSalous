<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="NourSystem neon turntable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a18"/>
      <stop offset="1" stop-color="#05050c"/>
    </linearGradient>
    <linearGradient id="plinth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a30"/>
      <stop offset="1" stop-color="#0b0b18"/>
    </linearGradient>
    <radialGradient id="platter" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#232345"/>
      <stop offset="1" stop-color="#14142a"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="0.4" cy="0.35" r="1">
      <stop offset="0" stop-color="#1b1b26"/>
      <stop offset="0.55" stop-color="#0c0c14"/>
      <stop offset="1" stop-color="#04040a"/>
    </radialGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="0.5" stop-color="#b026ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="armrod" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2a4a"/>
      <stop offset="0.5" stop-color="#9fd8ff"/>
      <stop offset="1" stop-color="#5a5a8a"/>
    </linearGradient>
    <filter id="neon" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

