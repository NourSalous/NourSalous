<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="450">
  <defs>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-mag" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .cat { font-family: 'Courier New', monospace; font-weight: bold; font-size: 16px; fill: #ffffff; }
    .pill { fill: #161b22; stroke-width: 1.5; }
    .pill-cyan { stroke: #00f3ff; }
    .pill-mag { stroke: #ff007f; }
    .pill-text-cyan { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #00f3ff; text-anchor: middle; }
    .pill-text-mag { font-family: sans-serif; font-size: 13px; font-weight: bold; fill: #ff007f; text-anchor: middle; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    .anim-pulse { animation: pulse 3s infinite; }
  </style>

  <!-- Languages -->
  <g transform="translate(40, 40)">
    <text x="0" y="22" class="cat">Languages</text>
    <line x1="0" y1="35" x2="120" y2="35" stroke="#30363d" stroke-width="1" />
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="90" height="30" rx="6" class="pill pill-cyan anim-pulse" filter="url(#glow-cyan)"/>
      <text x="45" y="19" class="pill-text-cyan">JavaScript</text>
      
      <rect x="105" y="0" width="90" height="30" rx="6" class="pill pill-cyan anim-pulse" style="animation-delay: 0.2s" filter="url(#glow-cyan)"/>
      <text x="150" y="19" class="pill-text-cyan">TypeScript</text>
      
      <rect x="210" y="0" width="60" height="30" rx="6" class="pill pill-cyan anim-pulse" style="animation-delay: 0.4s" filter="url(#glow-cyan)"/>
      <text x="240" y="19" class="pill-text-cyan">PHP</text>
      
      <rect x="285" y="0" width="60" height="30" rx="6" class="pill pill-cyan anim-pulse" style="animation-delay: 0.6s" filter="url(#glow-cyan)"/>
      <text x="315" y="19" class="pill-text-cyan">C#</text>
      
      <rect x="360" y="0" width="70" height="30" rx="6" class="pill pill-cyan anim-pulse" style="animation-delay: 0.8s" filter="url(#glow-cyan)"/>
      <text x="395" y="19" class="pill-text-cyan">HTML/CSS</text>
    </g>
  </g>

  <!-- Frontend -->
  <g transform="translate(40, 110)">
    <text x="0" y="22" class="cat">Frontend</text>
    <line x1="0" y1="35" x2="120" y2="35" stroke="#30363d" stroke-width="1" />
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="70" height="30" rx="6" class="pill pill-mag anim-pulse" filter="url(#glow-mag)"/>
      <text x="35" y="19" class="pill-text-mag">React</text>
      
      <rect x="85" y="0" width="80" height="30" rx="6" class="pill pill-mag anim-pulse" style="animation-delay: 0.3s" filter="url(#glow-mag)"/>
      <text x="125" y="19" class="pill-text-mag">Angular</text>
      
      <rect x="180" y="0" width="100" height="30" rx="6" class="pill pill-mag anim-pulse" style="animation-delay: 0.5s" filter="url(#glow-mag)"/>
      <text x="230" y="19" class="pill-text-mag">Tailwind CSS</text>
      
      <rect x="295" y="0" width="80" height="30" rx="6" class="pill pill-mag anim-pulse" style="animation-delay: 0.7s" filter="url(#glow-mag)"/>
      <text x="335" y="19" class="pill-text-mag">Three.js</text>
    </g>
  </g>

  <!-- Backend -->
  <g transform="translate(40, 180)">
    <text x="0" y="22" class="cat">Backend</text>
    <line x1="0" y1="35" x2="120" y2="35" stroke="#30363d" stroke-width="1" />
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="80" height="30" rx="6" class="pill pill-cyan anim-pulse" filter="url(#glow-cyan)"/>
      <text x="40" y="19" class="pill-text-cyan">Node.js</text>
      
      <rect x="95" y="0" width="80" height="30" rx="6" class="pill pill-cyan anim-pulse" style="animation-delay: 0.2s" filter="url(#glow-cyan)"/>
      <text x="135" y="19" class="pill-text-cyan">Express</text>
      
      <rect x="190" y="0" width="90" height="30" rx="6" class="pill pill-cyan anim-pulse" style="animation-delay: 0.4s" filter="url(#glow-cyan)"/>
      <text x="235" y="19" class="pill-text-cyan">REST APIs</text>
      
      <rect x="295" y="0" width="100" height="30" rx="6" class="pill pill-cyan anim-pulse" style="animation-delay: 0.6s" filter="url(#glow-cyan)"/>
      <text x="345" y="19" class="pill-text-cyan">Relational DBs</text>
    </g>
  </g>

  <!-- AI & Automation -->
  <g transform="translate(40, 250)">
    <text x="0" y="22" class="cat">AI &amp; Automation</text>
    <line x1="0" y1="35" x2="150" y2="35" stroke="#30363d" stroke-width="1" />
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="70" height="30" rx="6" class="pill pill-mag anim-pulse" filter="url(#glow-mag)"/>
      <text x="35" y="19" class="pill-text-mag">Claude</text>
      
      <rect x="85" y="0" width="90" height="30" rx="6" class="pill pill-mag anim-pulse" style="animation-delay: 0.1s" filter="url(#glow-mag)"/>
      <text x="130" y="19" class="pill-text-mag">Gemini API</text>
      
      <rect x="190" y="0" width="90" height="30" rx="6" class="pill pill-mag anim-pulse" style="animation-delay: 0.3s" filter="url(#glow-mag)"/>
      <text x="235" y="19" class="pill-text-mag">OpenAI API</text>
      
      <rect x="295" y="0" width="50" height="30" rx="6" class="pill pill-mag anim-pulse" style="animation-delay: 0.5s" filter="url(#glow-mag)"/>
      <text x="320" y="19" class="pill-text-mag">n8n</text>
    </g>
  </g>

  <!-- Tools -->
  <g transform="translate(40, 320)">
    <text x="0" y="22" class="cat">Tools</text>
    <line x1="0" y1="35" x2="120" y2="35" stroke="#30363d" stroke-width="1" />
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="70" height="30" rx="6" class="pill pill-cyan anim-pulse" filter="url(#glow-cyan)"/>
      <text x="35" y="19" class="pill-text-cyan">Docker</text>
      
      <rect x="85" y="0" width="50" height="30" rx="6" class="pill pill-cyan anim-pulse" style="animation-delay: 0.2s" filter="url(#glow-cyan)"/>
      <text x="110" y="19" class="pill-text-cyan">Git</text>
      
      <rect x="150" y="0" width="75" height="30" rx="6" class="pill pill-cyan anim-pulse" style="animation-delay: 0.4s" filter="url(#glow-cyan)"/>
      <text x="187.5" y="19" class="pill-text-cyan">Blender</text>
      
      <rect x="240" y="0" width="60" height="30" rx="6" class="pill pill-cyan anim-pulse" style="animation-delay: 0.6s" filter="url(#glow-cyan)"/>
      <text x="270" y="19" class="pill-text-cyan">Unity</text>
    </g>
  </g>
</svg>
