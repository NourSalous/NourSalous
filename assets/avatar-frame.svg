<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
  </defs>
  <!-- Outer Rotating Ring -->
  <g transform="translate(80, 80)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite" />
    <circle cx="0" cy="0" r="76" fill="none" stroke="#00f3ff" stroke-width="2" stroke-dasharray="40 20 10 10 100 20" opacity="0.6" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#ff007f" stroke-width="1.5" stroke-dasharray="10 40 20 20 60 40" opacity="0.5"/>
  </g>
  <!-- Inner Frame -->
  <circle cx="80" cy="80" r="64" fill="#0d1117" stroke="url(#cyber-grad)" stroke-width="3" filter="url(#glow)" />
  <!-- Cyber Avatar Graphic -->
  <g transform="translate(48, 54)">
    <path d="M0,0 L20,0 L32,48 L32,0 L48,0 L48,52 L28,52 L16,4 L16,52 L0,52 Z" fill="#00f3ff" />
    <path d="M42,20 L64,20 A10,10 0 0 1 74,30 L74,42 A10,10 0 0 1 64,52 L36,52 L36,42 L64,42 L64,30 L42,30 A10,10 0 0 1 32,20 L32,10 A10,10 0 0 1 42,0 L64,0 L64,10 L42,10 Z" fill="#ff007f" />
  </g>
  <!-- Overlay Scanlines -->
  <circle cx="80" cy="80" r="64" fill="url(#scanlines)" opacity="0.2"/>
  <defs>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000" />
    </pattern>
  </defs>
</svg>
