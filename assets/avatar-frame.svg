<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="glow-v" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-l" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Animated Violet Outer Ring -->
  <g transform="translate(80, 80)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="15s" repeatCount="indefinite" />
    <circle cx="0" cy="0" r="76" fill="none" stroke="#7000FF" stroke-width="2" stroke-dasharray="40 20 10 10 100 20" opacity="0.8" filter="url(#glow-v)"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#CCFF00" stroke-width="1.5" stroke-dasharray="10 40 20 20 60 40" opacity="0.6" filter="url(#glow-l)"/>
  </g>

  <!-- Inner Base -->
  <circle cx="80" cy="80" r="62" fill="#0d1117" stroke="#7000FF" stroke-width="2" filter="url(#glow-v)" />

  <!-- Cyber Geometric Avatar -->
  <g transform="translate(80, 80)">
    <animateTransform attributeName="transform" type="translate" values="80,78; 80,82; 80,78" dur="4s" repeatCount="indefinite" />
    <!-- Violet Backing -->
    <path d="M-30,-20 L0,-40 L30,-20 L30,20 L0,40 L-30,20 Z" fill="none" stroke="#7000FF" stroke-width="3" filter="url(#glow-v)" opacity="0.6"/>
    <!-- Lime Core -->
    <path d="M-20,-10 L0,-25 L20,-10 L20,15 L0,30 L-20,15 Z" fill="#0d1117" stroke="#CCFF00" stroke-width="2" filter="url(#glow-l)" />
    <!-- Cyber Eye/Core -->
    <circle cx="0" cy="0" r="6" fill="#CCFF00" filter="url(#glow-l)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <line x1="-20" y1="-10" x2="0" y2="0" stroke="#CCFF00" stroke-width="1.5"/>
    <line x1="20" y1="-10" x2="0" y2="0" stroke="#CCFF00" stroke-width="1.5"/>
    <line x1="0" y1="30" x2="0" y2="0" stroke="#CCFF00" stroke-width="1.5"/>
  </g>
</svg>
