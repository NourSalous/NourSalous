  <!-- ==================== CARD 5 — MENTARA ==================== -->
  <rect x="15" y="10" width="460" height="190" rx="18" fill="#0e0e20" opacity="0.5" filter="url(#bk)"/>
  <rect x="15" y="10" width="460" height="190" rx="18" fill="url(#gf)"/>
  <rect x="15" y="10" width="460" height="190" rx="18" fill="url(#ts)" clip-path="url(#c5)"/>
