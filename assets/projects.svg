    <text x="537" y="280" fill="#ffffff" font-size="24" font-weight="700">Uskudar Extreme</text>
    <text x="537" y="305" fill="#ffffff" opacity="0.42" font-size="12.5">University campus exploration game</text>
    <text x="537" y="322" fill="#ffffff" opacity="0.42" font-size="12.5">built in Unity with full 3D environments.</text>
  </g>
  <circle cx="950" cy="243" r="24" fill="#00fff9" fill-opacity="0.07" stroke="#00fff9" stroke-opacity="0.25" stroke-width="1"/>
  <g transform="translate(950,243)" stroke="#00fff9" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-7" y="-4" width="14" height="9" rx="2"/>
    <circle cx="-3" cy="0" r="2"/><circle cx="4" cy="0" r="2"/>
    <line x1="-1" y1="-6" x2="-3" y2="-4"/><line x1="3" y1="-6" x2="1" y2="-4"/>
    <circle cx="-1" cy="-7" r="1"/><circle cx="3" cy="-7" r="1"/>
  </g>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="500">
    <rect x="537" y="375" width="52" height="20" rx="10" fill="#00fff9" fill-opacity="0.08" stroke="#00fff9" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="563" y="389" text-anchor="middle" fill="#00fff9" opacity="0.75">Unity</text>
    <rect x="595" y="375" width="29" height="20" rx="10" fill="#b829f7" fill-opacity="0.08" stroke="#b829f7" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="609" y="389" text-anchor="middle" fill="#b829f7" opacity="0.75">C#</text>
  </g>

