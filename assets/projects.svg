    </filter>
    <filter id="tg" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <path id="b5" d="M33,10 Q15,10 15,28 L15,182 Q15,200 33,200 L457,200 Q475,200 475,182 L475,28 Q475,10 457,10 Z"/>
    <path id="b6" d="M533,10 Q515,10 515,28 L515,182 Q515,200 533,200 L957,200 Q975,200 975,182 L975,28 Q975,10 957,10 Z"/>
    <path id="b7" d="M33,215 Q15,215 15,233 L15,387 Q15,405 33,405 L457,405 Q475,405 475,387 L475,233 Q475,215 457,215 Z"/>
    <path id="b8" d="M533,215 Q515,215 515,233 L515,387 Q515,405 533,405 L957,405 Q975,405 975,387 L975,233 Q975,215 957,215 Z"/>
    <path id="b9" d="M283,420 Q265,420 265,438 L265,592 Q265,610 283,610 L707,610 Q725,610 725,592 L725,438 Q725,420 707,420 Z"/>

    <clipPath id="c5"><rect x="15" y="10" width="460" height="190" rx="18"/></clipPath>
    <clipPath id="c6"><rect x="515" y="10" width="460" height="190" rx="18"/></clipPath>
    <clipPath id="c7"><rect x="15" y="215" width="460" height="190" rx="18"/></clipPath>
    <clipPath id="c8"><rect x="515" y="215" width="460" height="190" rx="18"/></clipPath>
    <clipPath id="c9"><rect x="265" y="420" width="460" height="190" rx="18"/></clipPath>
