    <rect x="220" y="375" width="36" height="20" rx="10" fill="#00fff9" fill-opacity="0.08" stroke="#00fff9" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="238" y="389" text-anchor="middle" fill="#00fff9" opacity="0.75">JWT</text>
