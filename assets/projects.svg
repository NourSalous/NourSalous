  <circle r="18" filter="url(#tg)">
    <animate attributeName="fill" values="#00fff9;#b829f7;#ff00e5;#00fff9" dur="5s" repeatCount="indefinite"/>
    <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#b5"/></animateMotion>
  </circle>
  <circle r="3" fill="#ffffff" opacity="0.9">
    <animateMotion dur="4s" repeatCount="indefinite"><mpath href="#b5"/></animateMotion>
  </circle>

  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="37" y="38" fill="#ffffff" opacity="0.35" font-size="11" font-weight="600" letter-spacing="2">AI STUDY PLATFORM</text>
    <text x="37" y="75" fill="#ffffff" font-size="24" font-weight="700">Mentara</text>
    <text x="37" y="100" fill="#ffffff" opacity="0.42" font-size="12.5">RAG study assistant: lectures to flashcards,</text>
    <text x="37" y="117" fill="#ffffff" opacity="0.42" font-size="12.5">quizzes, and AI-powered answers.</text>
  </g>
  <circle cx="450" cy="38" r="24" fill="#00fff9" fill-opacity="0.07" stroke="#00fff9" stroke-opacity="0.25" stroke-width="1"/>
  <g transform="translate(450,38)" stroke="#00fff9" stroke-width="1.2" fill="none" stroke-linecap="round">
    <circle cx="0" cy="0" r="7"/>
    <path d="M-3,-3 Q0,0 3,-3"/><path d="M-4,1 Q0,4 4,1"/>
    <circle cx="0" cy="0" r="2" fill="#00fff9" opacity="0.3"/>
  </g>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="500">
    <rect x="37" y="170" width="59" height="20" rx="10" fill="#00fff9" fill-opacity="0.08" stroke="#00fff9" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="66" y="184" text-anchor="middle" fill="#00fff9" opacity="0.75">Angular</text>
    <rect x="102" y="170" width="54" height="20" rx="10" fill="#00fff9" fill-opacity="0.08" stroke="#00fff9" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="129" y="184" text-anchor="middle" fill="#00fff9" opacity="0.75">NestJS</text>
    <rect x="162" y="170" width="76" height="20" rx="10" fill="#b829f7" fill-opacity="0.08" stroke="#b829f7" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="200" y="184" text-anchor="middle" fill="#b829f7" opacity="0.75">PostgreSQL</text>
    <rect x="244" y="170" width="59" height="20" rx="10" fill="#b829f7" fill-opacity="0.08" stroke="#b829f7" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="273" y="184" text-anchor="middle" fill="#b829f7" opacity="0.75">pgvector</text>
    <rect x="309" y="170" width="36" height="20" rx="10" fill="#ff00e5" fill-opacity="0.08" stroke="#ff00e5" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="327" y="184" text-anchor="middle" fill="#ff00e5" opacity="0.75">RAG</text>
  </g>

  <!-- ==================== CARD 6 — EEG ADHD ==================== -->
  <rect x="515" y="10" width="460" height="190" rx="18" fill="#0e0e20" opacity="0.5" filter="url(#bk)"/>
  <rect x="515" y="10" width="460" height="190" rx="18" fill="url(#gf)"/>
