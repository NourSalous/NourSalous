<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 620" width="100%">
  <defs>
    <linearGradient id="gf" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.055"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.015"/>
    </linearGradient>
    <linearGradient id="ts" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="14%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bs" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00fff9" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#b829f7" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ff00e5" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="bk" x="-30%" y="-30%" width="160%" height="160%">
