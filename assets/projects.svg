    <text x="287" y="485" fill="#ffffff" font-size="24" font-weight="700">ApexGift</text>
    <text x="287" y="510" fill="#ffffff" opacity="0.42" font-size="12.5">OpenAI-powered gift recommendation engine</text>
    <text x="287" y="527" fill="#ffffff" opacity="0.42" font-size="12.5">that takes the anxiety out of gift-giving.</text>
