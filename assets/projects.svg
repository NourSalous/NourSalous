    <text x="537" y="38" fill="#ffffff" opacity="0.35" font-size="11" font-weight="600" letter-spacing="2">ML RESEARCH</text>
    <text x="537" y="75" fill="#ffffff" font-size="24" font-weight="700">EEG-Based ADHD Detection</text>
    <text x="537" y="100" fill="#ffffff" opacity="0.42" font-size="12.5">ML paper detecting ADHD via EEG signals.</text>
    <text x="537" y="117" fill="#ffffff" opacity="0.42" font-size="12.5">SVM, XGBoost, SHAP analysis. <tspan fill="#00fff9" opacity="0.7">84.4%</tspan> sensitivity.</text>
  </g>
  <circle cx="950" cy="38" r="24" fill="#b829f7" fill-opacity="0.07" stroke="#b829f7" stroke-opacity="0.25" stroke-width="1"/>
  <g transform="translate(950,38)" stroke="#b829f7" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M-7,3 Q-4,-6 0,-2 Q4,-7 7,3"/>
    <line x1="-9" y1="3" x2="9" y2="3"/>
    <circle cx="-4" cy="-1" r="1" fill="#b829f7" opacity="0.4"/>
    <circle cx="4" cy="0" r="1" fill="#b829f7" opacity="0.4"/>
  </g>
  <g font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10" font-weight="500">
    <rect x="537" y="170" width="54" height="20" rx="10" fill="#b829f7" fill-opacity="0.08" stroke="#b829f7" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="564" y="184" text-anchor="middle" fill="#b829f7" opacity="0.75">Python</text>
    <rect x="597" y="170" width="76" height="20" rx="10" fill="#b829f7" fill-opacity="0.08" stroke="#b829f7" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="635" y="184" text-anchor="middle" fill="#b829f7" opacity="0.75">scikit-learn</text>
    <rect x="679" y="170" width="44" height="20" rx="10" fill="#ff00e5" fill-opacity="0.08" stroke="#ff00e5" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="701" y="184" text-anchor="middle" fill="#ff00e5" opacity="0.75">SHAP</text>
    <rect x="729" y="170" width="29" height="20" rx="10" fill="#00fff9" fill-opacity="0.08" stroke="#00fff9" stroke-opacity="0.2" stroke-width="0.8"/>
    <text x="743" y="184" text-anchor="middle" fill="#00fff9" opacity="0.75">ML</text>
