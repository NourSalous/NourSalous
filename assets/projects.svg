    <text x="37" y="322" fill="#ffffff" opacity="0.42" font-size="12.5">and multi-stage JWT auth portal.</text>
  </g>
  <circle cx="450" cy="243" r="24" fill="#ff00e5" fill-opacity="0.07" stroke="#ff00e5" stroke-opacity="0.25" stroke-width="1"/>
