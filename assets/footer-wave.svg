<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 70" width="100%" height="35" role="img" aria-label="Animated footer wave">
  <defs>
    <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7b3bff">
        <animate attributeName="stop-color" values="#7b3bff;#00f0ff;#35ff9e;#7b3bff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="navGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#7b3bff" flood-opacity="0.6"/>
    </filter>
  </defs>
  <path d="M0,20 C200,70 400,0 600,30 C780,55 900,30 1000,40 L1000,70 L0,70 Z"
        fill="url(#navGrad)" filter="url(#navGlow)" opacity="0.7">
    <animate attributeName="d"
      values="M0,20 C200,70 400,0 600,30 C780,55 900,30 1000,40 L1000,70 L0,70 Z;
              M0,30 C200,10 400,60 600,20 C780,50 900,60 1000,30 L1000,70 L0,70 Z;
              M0,20 C200,70 400,0 600,30 C780,55 900,30 1000,40 L1000,70 L0,70 Z"
      dur="9s" repeatCount="indefinite"/>
  </path>
</svg>