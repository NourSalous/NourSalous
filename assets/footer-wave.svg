<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="100%" height="40" role="img" aria-label="Animated footer wave">
  <defs>
    <linearGradient id="fg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7b3bff">
        <animate attributeName="stop-color" values="#7b3bff;#00f0ff;#35ff9e;#7b3bff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="fgGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#7b3bff" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00f0ff" flood-opacity="0.25"/>
    </filter>
    <filter id="ftGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#7b3bff" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Wave -->
  <path d="M0,25 C200,65 400,5 600,35 C780,60 900,25 1000,45 L1000,80 L0,80 Z"
        fill="url(#fg)" filter="url(#fgGlow)" opacity="0.6">
    <animate attributeName="d"
      values="M0,25 C200,65 400,5 600,35 C780,60 900,25 1000,45 L1000,80 L0,80 Z;
              M0,40 C200,10 400,55 600,20 C780,45 900,60 1000,30 L1000,80 L0,80 Z;
              M0,25 C200,65 400,5 600,35 C780,60 900,25 1000,45 L1000,80 L0,80 Z"
      dur="9s" repeatCount="indefinite"/>
  </path>

  <!-- Thin secondary wave -->
  <path d="M0,35 C250,55 450,15 650,30 C800,50 920,20 1000,38 L1000,80 L0,80 Z"
        fill="url(#fg)" opacity="0.2">
    <animate attributeName="d"
      values="M0,35 C250,55 450,15 650,30 C800,50 920,20 1000,38 L1000,80 L0,80 Z;
              M0,30 C250,15 450,50 650,25 C800,10 920,45 1000,35 L1000,80 L0,80 Z;
              M0,35 C250,55 450,15 650,30 C800,50 920,20 1000,38 L1000,80 L0,80 Z"
      dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- Floating sparkles -->
  <g>
    <circle cx="150" cy="30" r="2" fill="#35ff9e" filter="url(#ftGlow)">
      <animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="20" r="2.2" fill="#00f0ff" filter="url(#ftGlow)">
      <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="850" cy="28" r="1.8" fill="#7b3bff" filter="url(#ftGlow)">
      <animate attributeName="opacity" values="0;1;0" dur="4.5s" repeatCount="indefinite" begin="3s"/>
    </circle>
  </g>
</svg>