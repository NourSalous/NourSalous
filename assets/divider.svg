<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 40" width="100%">
  <defs>
    <!-- Glowing Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFF9" stop-opacity="0" />
      <stop offset="25%" stop-color="#00FFF9" />
      <stop offset="50%" stop-color="#B829F7" />
      <stop offset="75%" stop-color="#FF00E5" />
      <stop offset="100%" stop-color="#FF00E5" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Glowing Line -->
  <rect x="0" y="19" width="850" height="2" fill="url(#lineGrad)" filter="url(#glow)" opacity="0.8">
    <animate attributeName="opacity" values="0.4; 1; 0.4" dur="4s" repeatCount="indefinite" />
  </rect>

  <!-- Center Diamond -->
  <polygon points="425,12 433,20 425,28 417,20" fill="#00FFF9" filter="url(#glow)">
    <animateTransform attributeName="transform" type="scale" values="1; 1.2; 1" cx="425" cy="20" dur="2s" repeatCount="indefinite" />
    <animate attributeName="fill" values="#00FFF9; #FF00E5; #00FFF9" dur="4s" repeatCount="indefinite" />
  </polygon>
</svg>