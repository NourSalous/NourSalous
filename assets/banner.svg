<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050A" />
      <stop offset="50%" stop-color="#0F0C20" />
      <stop offset="100%" stop-color="#05050A" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFF9" />
      <stop offset="50%" stop-color="#B829F7" />
      <stop offset="100%" stop-color="#FF00E5" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Floating Orbs (Background) -->
  <circle cx="100" cy="150" r="40" fill="#B829F7" opacity="0.1" filter="url(#glow-heavy)">
    <animate attributeName="cy" values="150; 120; 150" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cx" values="100; 120; 100" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="750" cy="80" r="60" fill="#00FFF9" opacity="0.1" filter="url(#glow-heavy)">
    <animate attributeName="cy" values="80; 110; 80" dur="9s" repeatCount="indefinite" />
    <animate attributeName="cx" values="750; 720; 750" dur="11s" repeatCount="indefinite" />
  </circle>
  <circle cx="450" cy="200" r="30" fill="#FF00E5" opacity="0.1" filter="url(#glow-heavy)">
    <animate attributeName="cy" values="200; 170; 200" dur="7s" repeatCount="indefinite" />
    <animate attributeName="cx" values="450; 480; 450" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- Title Text -->
  <text x="425" y="115" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="64" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4" filter="url(#glow)">
    NOUR SALOUS
  </text>

  <!-- Subtitle Text -->
  <text x="425" y="160" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="500" font-size="16" fill="#A0A0C0" text-anchor="middle" letter-spacing="6">
    SOFTWARE ENGINEERING • AI SYSTEMS • ARCHITECTURE
  </text>

  <!-- Animated Wave Line -->
  <path d="M 0 240 Q 212.5 220 425 240 T 850 240" fill="none" stroke="url(#textGrad)" stroke-width="2" opacity="0.5">
    <animate attributeName="d" values="M 0 240 Q 212.5 220 425 240 T 850 240; M 0 240 Q 212.5 260 425 240 T 850 240; M 0 240 Q 212.5 220 425 240 T 850 240" dur="6s" repeatCount="indefinite" />
  </path>
</svg>