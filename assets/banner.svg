<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0e1424" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-heavy" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff2bd6" />
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <circle cx="120" cy="140" r="45" fill="#00f0ff" opacity="0.14" filter="url(#glow-heavy)">
    <animate attributeName="cy" values="140; 110; 140" dur="8s" repeatCount="indefinite" />
    <animate attributeName="cx" values="120; 145; 120" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="730" cy="90" r="55" fill="#ff2bd6" opacity="0.14" filter="url(#glow-heavy)">
    <animate attributeName="cy" values="90; 120; 90" dur="9s" repeatCount="indefinite" />
    <animate attributeName="cx" values="730; 700; 730" dur="11s" repeatCount="indefinite" />
  </circle>
  <circle cx="430" cy="190" r="35" fill="#a855f7" opacity="0.16" filter="url(#glow-heavy)">
    <animate attributeName="cy" values="190; 165; 190" dur="7s" repeatCount="indefinite" />
    <animate attributeName="cx" values="430; 460; 430" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- High-tech HUD brackets -->
  <path d="M 45 45 L 25 45 L 25 75" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.7" />
  <path d="M 805 45 L 825 45 L 825 75" fill="none" stroke="#ff2bd6" stroke-width="2" opacity="0.7" />
  <path d="M 45 205 L 25 205 L 25 175" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.7" />
  <path d="M 805 205 L 825 205 L 825 175" fill="none" stroke="#ff2bd6" stroke-width="2" opacity="0.7" />

  <text x="425" y="112" font-family="'Orbitron', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="58" fill="url(#textGrad)" text-anchor="middle" letter-spacing="5" filter="url(#glow)">
    NOUR SALOUS
  </text>

  <text x="425" y="156" font-family="'JetBrains Mono', 'Fira Code', monospace" font-weight="600" font-size="14" fill="url(#subGrad)" text-anchor="middle" letter-spacing="5">
    FULL-STACK ARCHITECT · APPLIED AI &amp; ML · 3D WEB / AR
  </text>

  <path d="M 0 238 Q 212.5 218 425 238 T 850 238" fill="none" stroke="url(#textGrad)" stroke-width="2" opacity="0.6">
    <animate attributeName="d" values="M 0 238 Q 212.5 218 425 238 T 850 238; M 0 238 Q 212.5 258 425 238 T 850 238; M 0 238 Q 212.5 218 425 238 T 850 238" dur="6s" repeatCount="indefinite" />
  </path>
</svg>
