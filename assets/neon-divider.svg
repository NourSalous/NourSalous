<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="100%" height="50" role="img" aria-label="Animated neon divider">
  <defs>
    <linearGradient id="dg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#7b3bff;#35ff9e;#00f0ff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#7b3bff">
        <animate attributeName="stop-color" values="#7b3bff;#35ff9e;#00f0ff;#7b3bff" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="80%" stop-color="#35ff9e">
        <animate attributeName="stop-color" values="#35ff9e;#00f0ff;#7b3bff;#35ff9e" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="dgGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#00f0ff" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#7b3bff" flood-opacity="0.3"/>
    </filter>
    <filter id="sparkGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00f0ff" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Primary flowing wave -->
  <path d="M0,55 C150,20 300,85 500,50 C700,15 850,75 1000,40 L1000,100 L0,100 Z"
        fill="url(#dg)" filter="url(#dgGlow)" opacity="0.75">
    <animate attributeName="d"
      values="M0,55 C150,20 300,85 500,50 C700,15 850,75 1000,40 L1000,100 L0,100 Z;
              M0,40 C150,75 300,15 500,45 C700,80 850,20 1000,55 L1000,100 L0,100 Z;
              M0,55 C150,20 300,85 500,50 C700,15 850,75 1000,40 L1000,100 L0,100 Z"
      dur="8s" repeatCount="indefinite"/>
  </path>

  <!-- Secondary ribbon (thinner, offset) -->
  <path d="M0,65 C180,35 350,90 520,55 C690,20 830,80 1000,50 L1000,100 L0,100 Z"
        fill="url(#dg)" opacity="0.25">
    <animate attributeName="d"
      values="M0,65 C180,35 350,90 520,55 C690,20 830,80 1000,50 L1000,100 L0,100 Z;
              M0,50 C180,80 350,30 520,60 C690,85 830,35 1000,60 L1000,100 L0,100 Z;
              M0,65 C180,35 350,90 520,55 C690,20 830,80 1000,50 L1000,100 L0,100 Z"
      dur="11s" repeatCount="indefinite"/>
  </path>

  <!-- Sparkle dots riding the wave -->
  <g>
    <circle cx="200" cy="50" r="2.5" fill="#00f0ff" filter="url(#sparkGlow)">
      <animate attributeName="cx" values="200;800;200" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="50;35;50" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="40" r="2" fill="#35ff9e" filter="url(#sparkGlow)">
      <animate attributeName="cx" values="600;150;600" dur="12s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="cy" values="40;55;40" dur="12s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0;1;0" dur="12s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="400" cy="60" r="1.8" fill="#7b3bff" filter="url(#sparkGlow)">
      <animate attributeName="cx" values="400;900;400" dur="14s" repeatCount="indefinite" begin="4s"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="14s" repeatCount="indefinite" begin="4s"/>
    </circle>
  </g>
</svg>