<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" width="100%" height="160">
  <defs>
    <filter id="neon" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="2" y="2" width="256" height="156" rx="12" fill="#0a0e14" stroke="#00f3ff" stroke-width="1.5" filter="url(#neon)">
    <animate attributeName="stroke-opacity" values="1;0.4;1" dur="3.5s" repeatCount="indefinite" />
  </rect>
  
  <path d="M 2 20 L 10 12 L 20 12" fill="none" stroke="#ff007f" stroke-width="2" />
  <path d="M 258 140 L 250 148 L 240 148" fill="none" stroke="#00f3ff" stroke-width="2" />
  
  <text x="20" y="35" font-family="Courier New, monospace" font-weight="bold" font-size="18" fill="#ffffff">3D Web &amp; AR</text>
  
  <text x="20" y="60" font-family="sans-serif" font-size="12" fill="#8b949e" width="220">
    <tspan x="20" dy="0">High-performance graphics,</tspan>
    <tspan x="20" dy="16">mesh segmentation, coordinate</tspan>
    <tspan x="20" dy="16">tracking &amp; USDZ export.</tspan>
  </text>
  
  <g transform="translate(20, 115)">
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#161b22" stroke="#00f3ff" stroke-width="1"/>
    <text x="30" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00f3ff" text-anchor="middle">Three.js</text>
    
    <rect x="70" y="0" width="55" height="20" rx="4" fill="#161b22" stroke="#ff007f" stroke-width="1"/>
    <text x="97.5" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ff007f" text-anchor="middle">Blender</text>
    
    <rect x="135" y="0" width="35" height="20" rx="4" fill="#161b22" stroke="#00f3ff" stroke-width="1"/>
    <text x="152.5" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00f3ff" text-anchor="middle">AR</text>
  </g>
</svg>
