<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05070f" />
      <stop offset="60%" stop-color="#0b1021" />
      <stop offset="100%" stop-color="#121b33" />
    </linearGradient>

    <!-- Building Gradients -->
    <linearGradient id="bldgCyanTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="bldgCyanLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="bldgCyanRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#075985" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>

    <linearGradient id="bldgPurpTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="bldgPurpLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="bldgPurpRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>

    <linearGradient id="bldgPinkTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ff2bd6" />
    </linearGradient>
    <linearGradient id="bldgPinkLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <linearGradient id="bldgPinkRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9d174d" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>

    <linearGradient id="bldgMintTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#00ffa3" />
    </linearGradient>
    <linearGradient id="bldgMintLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="bldgMintRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>

    <filter id="cityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="isoGrid" width="40" height="23" patternUnits="userSpaceOnUse">
      <path d="M 0 11.5 L 20 0 L 40 11.5 L 20 23 Z" fill="none" stroke="#38bdf8" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Sky Background -->
  <rect width="100%" height="100%" fill="url(#skyGrad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#isoGrid)" rx="16" />

  <!-- Stars & Auroral glow -->
  <circle cx="80" cy="40" r="1.5" fill="#f8fafc" opacity="0.6" />
  <circle cx="210" cy="25" r="1.2" fill="#38bdf8" opacity="0.8" />
  <circle cx="340" cy="55" r="1.5" fill="#c084fc" opacity="0.7" />
  <circle cx="510" cy="30" r="1" fill="#f8fafc" opacity="0.5" />
  <circle cx="680" cy="45" r="1.8" fill="#00ffa3" opacity="0.7" />
  <circle cx="780" cy="20" r="1.2" fill="#f472b6" opacity="0.8" />

  <!-- Aurora Ribbons -->
  <path d="M 0 50 Q 200 20 425 60 T 850 40" fill="none" stroke="#00f0ff" stroke-width="28" opacity="0.04" filter="url(#cityGlow)" />
  <path d="M 0 70 Q 250 100 500 50 T 850 80" fill="none" stroke="#a855f7" stroke-width="32" opacity="0.04" filter="url(#cityGlow)" />

  <!-- Horizon Glow -->
  <line x1="30" y1="280" x2="820" y2="280" stroke="#00f0ff" stroke-width="1.5" opacity="0.3" />

  <!-- Isometric Building Macro: helper projection function
       Isometric block at (cx, base_y), width W, depth D, height H -->

  <!-- Group: Background Skyline Silhouette -->
  <g opacity="0.35">
    <polygon points="120,280 120,160 145,160 145,280" fill="#0c1938" />
    <polygon points="180,280 180,130 215,130 215,280" fill="#131e42" />
    <polygon points="260,280 260,110 295,110 295,280" fill="#182352" />
    <polygon points="380,280 380,95 415,95 415,280" fill="#1b255c" />
    <polygon points="460,280 460,120 495,120 495,280" fill="#182352" />
    <polygon points="560,280 560,105 600,105 600,280" fill="#131e42" />
    <polygon points="670,280 670,140 710,140 710,280" fill="#0c1938" />
  </g>

  <!-- Group: Foreground Isometric 3D Contribution Towers -->
  <!-- Tower 1: Small Cyan (Left flank) -->
  <g transform="translate(65, 200)">
    <!-- Top Face -->
    <polygon points="20,0 40,11.5 20,23 0,11.5" fill="url(#bldgCyanTop)" />
    <!-- Left Face -->
    <polygon points="0,11.5 20,23 20,80 0,68.5" fill="url(#bldgCyanLeft)" />
    <!-- Right Face -->
    <polygon points="20,23 40,11.5 40,68.5 20,80" fill="url(#bldgCyanRight)" />
    <!-- Windows -->
    <circle cx="8" cy="35" r="1.2" fill="#e0f2fe" opacity="0.8" />
    <circle cx="8" cy="50" r="1.2" fill="#e0f2fe" opacity="0.8" />
    <circle cx="30" cy="35" r="1.2" fill="#e0f2fe" opacity="0.8" />
  </g>

  <!-- Tower 2: Medium Violet Tower -->
  <g transform="translate(130, 150)">
    <polygon points="25,0 50,14 25,28 0,14" fill="url(#bldgPurpTop)" />
    <polygon points="0,14 25,28 25,130 0,116" fill="url(#bldgPurpLeft)" />
    <polygon points="25,28 50,14 50,116 25,130" fill="url(#bldgPurpRight)" />
    <!-- S敵e windows -->
    <line x1="8" y1="40" x2="18" y2="45" stroke="#f3e8ff" stroke-width="1.5" opacity="0.7" />
    <line x1="8" y1="65" x2="18" y2="70" stroke="#f3e8ff" stroke-width="1.5" opacity="0.7" />
    <line x1="8" y1="90" x2="18" y2="95" stroke="#f3e8ff" stroke-width="1.5" opacity="0.7" />
    <line x1="32" y1="45" x2="42" y2="40" stroke="#f3e8ff" stroke-width="1.5" opacity="0.7" />
    <line x1="32" y1="70" x2="42" y2="65" stroke="#f3e8ff" stroke-width="1.5" opacity="0.7" />
  </g>

  <!-- Tower 3: Skyscraper Cyan with Rooftop Spire (Major Sprint) -->
  <g transform="translate(210, 85)">
    <!-- Spire -->
    <line x1="28" y1="-25" x2="28" y2="0" stroke="#00f0ff" stroke-width="2" filter="url(#cityGlow)" />
    <circle cx="28" cy="-25" r="3" fill="#ffffff" filter="url(#cityGlow)">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <!-- Tower Body -->
    <polygon points="28,0 56,16 28,32 0,16" fill="url(#bldgCyanTop)" />
    <polygon points="0,16 28,32 28,195 0,179" fill="url(#bldgCyanLeft)" />
    <polygon points="28,32 56,16 56,179 28,195" fill="url(#bldgCyanRight)" />
    <!-- Grid of Lit Windows -->
    <circle cx="10" cy="50" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="18" cy="55" r="1.5" fill="#00f0ff" opacity="0.9" />
    <circle cx="10" cy="75" r="1.5" fill="#00f0ff" opacity="0.9" />
    <circle cx="18" cy="80" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="10" cy="105" r="1.5" fill="#00f0ff" opacity="0.9" />
    <circle cx="18" cy="110" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="10" cy="135" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="38" cy="55" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="46" cy="50" r="1.5" fill="#00f0ff" opacity="0.9" />
    <circle cx="38" cy="80" r="1.5" fill="#00f0ff" opacity="0.9" />
    <circle cx="46" cy="75" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="38" cy="110" r="1.5" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Tower 4: Neon Pink Mid-Rise -->
  <g transform="translate(300, 165)">
    <polygon points="22,0 44,12 22,24 0,12" fill="url(#bldgPinkTop)" />
    <polygon points="0,12 22,24 22,115 0,103" fill="url(#bldgPinkLeft)" />
    <polygon points="22,24 44,12 44,103 22,115" fill="url(#bldgPinkRight)" />
    <line x1="7" y1="40" x2="15" y2="44" stroke="#fbcfe8" stroke-width="1.5" opacity="0.8" />
    <line x1="7" y1="65" x2="15" y2="69" stroke="#fbcfe8" stroke-width="1.5" opacity="0.8" />
    <line x1="28" y1="44" x2="36" y2="40" stroke="#fbcfe8" stroke-width="1.5" opacity="0.8" />
    <line x1="28" y1="69" x2="36" y2="65" stroke="#fbcfe8" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Tower 5: Mega Cathedral of Code (Centerpiece - High Honors & Thesis) -->
  <g transform="translate(380, 50)">
    <!-- Dual Spire -->
    <line x1="18" y1="-30" x2="18" y2="0" stroke="#ff2bd6" stroke-width="1.8" filter="url(#cityGlow)" />
    <line x1="48" y1="-30" x2="48" y2="0" stroke="#00f0ff" stroke-width="1.8" filter="url(#cityGlow)" />
    <circle cx="18" cy="-30" r="3" fill="#ff2bd6" filter="url(#cityGlow)">
      <animate attributeName="opacity" values="1; 0.3; 1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="48" cy="-30" r="3" fill="#00f0ff" filter="url(#cityGlow)">
      <animate attributeName="opacity" values="0.3; 1; 0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <polygon points="33,0 66,19 33,38 0,19" fill="url(#bldgPurpTop)" />
    <polygon points="0,19 33,38 33,230 0,211" fill="url(#bldgPurpLeft)" />
    <polygon points="33,38 66,19 66,211 33,230" fill="url(#bldgPurpRight)" />
    <!-- Vertical Data Channel on Face -->
    <line x1="16" y1="50" x2="16" y2="200" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8 6" opacity="0.75" />
    <line x1="50" y1="50" x2="50" y2="200" stroke="#ff2bd6" stroke-width="2" stroke-dasharray="8 6" opacity="0.75" />
  </g>

  <!-- Tower 6: Mint Emerald Research Tower (EEG / MIRAI Lab) -->
  <g transform="translate(485, 110)">
    <polygon points="26,0 52,15 26,30 0,15" fill="url(#bldgMintTop)" />
    <polygon points="0,15 26,30 26,170 0,155" fill="url(#bldgMintLeft)" />
    <polygon points="26,30 52,15 52,155 26,170" fill="url(#bldgMintRight)" />
    <circle cx="9" cy="45" r="1.5" fill="#a7f3d0" opacity="0.9" />
    <circle cx="17" cy="50" r="1.5" fill="#a7f3d0" opacity="0.9" />
    <circle cx="9" cy="75" r="1.5" fill="#a7f3d0" opacity="0.9" />
    <circle cx="17" cy="80" r="1.5" fill="#a7f3d0" opacity="0.9" />
    <circle cx="9" cy="110" r="1.5" fill="#a7f3d0" opacity="0.9" />
    <circle cx="34" cy="50" r="1.5" fill="#a7f3d0" opacity="0.9" />
    <circle cx="42" cy="45" r="1.5" fill="#a7f3d0" opacity="0.9" />
    <circle cx="34" cy="80" r="1.5" fill="#a7f3d0" opacity="0.9" />
  </g>

  <!-- Tower 7: Cyber Cyan Mid-Rise -->
  <g transform="translate(575, 140)">
    <polygon points="24,0 48,14 24,28 0,14" fill="url(#bldgCyanTop)" />
    <polygon points="0,14 24,28 24,140 0,126" fill="url(#bldgCyanLeft)" />
    <polygon points="24,28 48,14 48,126 24,140" fill="url(#bldgCyanRight)" />
    <line x1="8" y1="45" x2="16" y2="50" stroke="#bae6fd" stroke-width="1.5" opacity="0.8" />
    <line x1="8" y1="75" x2="16" y2="80" stroke="#bae6fd" stroke-width="1.5" opacity="0.8" />
    <line x1="32" y1="50" x2="40" y2="45" stroke="#bae6fd" stroke-width="1.5" opacity="0.8" />
    <line x1="32" y1="80" x2="40" y2="75" stroke="#bae6fd" stroke-width="1.5" opacity="0.8" />
  </g>

  <!-- Tower 8: Violet & Rose Double Terrace -->
  <g transform="translate(660, 175)">
    <polygon points="20,0 40,11.5 20,23 0,11.5" fill="url(#bldgPurpTop)" />
    <polygon points="0,11.5 20,23 20,105 0,93.5" fill="url(#bldgPurpLeft)" />
    <polygon points="20,23 40,11.5 40,93.5 20,105" fill="url(#bldgPurpRight)" />
    <circle cx="8" cy="40" r="1.2" fill="#f3e8ff" opacity="0.8" />
    <circle cx="8" cy="65" r="1.2" fill="#f3e8ff" opacity="0.8" />
    <circle cx="30" cy="40" r="1.2" fill="#f3e8ff" opacity="0.8" />
  </g>

  <!-- Tower 9: Edge Outpost -->
  <g transform="translate(735, 215)">
    <polygon points="18,0 36,10 18,20 0,10" fill="url(#bldgPinkTop)" />
    <polygon points="0,10 18,20 18,65 0,55" fill="url(#bldgPinkLeft)" />
    <polygon points="18,20 36,10 36,55 18,65" fill="url(#bldgPinkRight)" />
    <circle cx="7" cy="30" r="1" fill="#fce7f3" opacity="0.8" />
    <circle cx="27" cy="30" r="1" fill="#fce7f3" opacity="0.8" />
  </g>

  <!-- Bottom HUD Status Label -->
  <rect x="250" y="278" width="350" height="28" rx="14" fill="#0c1222" stroke="#00f0ff" stroke-width="1" opacity="0.8" />
  <text x="425" y="296" font-family="'Orbitron', monospace" font-size="11" font-weight="700" fill="#00f0ff" text-anchor="middle" letter-spacing="2">
    ◆ CONTINUOUS CODE HARVEST · 365 DAYS BUILD CITY ◆
  </text>
</svg>
