<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="cyan-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="magenta-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c2128" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <linearGradient id="platter-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <linearGradient id="label-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="tonearm-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b949e" />
      <stop offset="50%" stop-color="#c9d1d9" />
      <stop offset="100%" stop-color="#484f58" />
    </linearGradient>

    <!-- Vinyl Sheen / Specular Radial Gradient -->
    <radialGradient id="vinyl-sheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="45%" stop-color="#010409" />
      <stop offset="50%" stop-color="#21262d" />
      <stop offset="55%" stop-color="#010409" />
      <stop offset="98%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#30363d" />
    </radialGradient>
  </defs>

  <!-- Base Chassis Outer Frame -->
  <rect x="40" y="40" width="420" height="420" rx="24" fill="url(#chassis-grad)" stroke="#30363d" stroke-width="2" />

  <!-- Outer Neon Circuit Accents (Pulsating) -->
  <g opacity="0.8">
    <path d="M 60 40 L 440 40 A 20 20 0 0 1 460 60 L 460 440 A 20 20 0 0 1 440 460 L 60 460 A 20 20 0 0 1 40 440 L 40 60 A 20 20 0 0 1 60 40 Z" 
          fill="none" stroke="#00f3ff" stroke-width="1.5" filter="url(#cyan-glow)">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="4s" repeatCount="indefinite" />
    </path>
    <!-- Futuristic Corner Cuts -->
    <path d="M 40 90 L 90 40 M 460 410 L 410 460" stroke="#00f3ff" stroke-width="2" filter="url(#cyan-glow)" />
  </g>

  <!-- Chassis Inner Bezel -->
  <rect x="52" y="52" width="396" height="396" rx="16" fill="#161b22" stroke="#21262d" stroke-width="2" />

  <!-- Sub-Panel Grid Lines -->
  <g stroke="#30363d" stroke-width="0.5" opacity="0.4">
    <line x1="52" y1="120" x2="448" y2="120" />
    <line x1="52" y1="380" x2="448" y2="380" />
    <line x1="340" y1="52" x2="340" y2="448" />
  </g>

  <!-- Platter Rim -->
  <circle cx="215" cy="250" r="165" fill="url(#platter-grad)" stroke="#00f3ff" stroke-width="1" opacity="0.6" filter="url(#cyan-glow)" />
  <circle cx="215" cy="250" r="160" fill="#010409" stroke="#30363d" stroke-width="3" />

  <!-- ROTATING VINYL ASSEMBLY -->
  <g>
    <!-- Continuous 360 Rotation -->
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 215 250" 
      to="360 215 250" 
      dur="2.5s" 
      repeatCount="indefinite" />

    <!-- Main Disc Base -->
    <circle cx="215" cy="250" r="152" fill="url(#vinyl-sheen)" />

    <!-- Vinyl Grooves -->
    <g stroke="#21262d" stroke-width="1" fill="none" opacity="0.75">
      <circle cx="215" cy="250" r="142" />
      <circle cx="215" cy="250" r="132" />
      <circle cx="215" cy="250" r="122" />
      <circle cx="215" cy="250" r="112" />
      <circle cx="215" cy="250" r="102" />
      <circle cx="215" cy="250" r="92" />
      <circle cx="215" cy="250" r="82" />
      <circle cx="215" cy="250" r="72" />
    </g>

    <!-- Specular Light Reflection Cuts (Visual Polish) -->
    <path d="M 215 98 A 152 152 0 0 1 322 142 L 215 250 Z" fill="#ffffff" opacity="0.03" />
    <path d="M 215 402 A 152 152 0 0 1 108 358 L 215 250 Z" fill="#ffffff" opacity="0.03" />

    <!-- Center Label Outer Ring -->
    <circle cx="215" cy="250" r="55" fill="#0d1117" stroke="#ff007f" stroke-width="1.5" filter="url(#magenta-glow)" />

    <!-- Center Label Body -->
    <circle cx="215" cy="250" r="50" fill="url(#label-grad)" />

    <!-- Label Cyber Graphics (Rotates with disc) -->
    <circle cx="215" cy="250" r="38" fill="none" stroke="#00f3ff" stroke-width="1" stroke-dasharray="6 4" opacity="0.8" />
    <path d="M 200 250 L 230 250 M 215 235 L 215 265" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
    <circle cx="215" cy="250" r="22" fill="#0d1117" />
    
    <!-- Spindle Hole -->
    <circle cx="215" cy="250" r="5" fill="#010409" stroke="#8b949e" stroke-width="1.5" />
  </g>

  <!-- DECK CONTROLS & INTERFACE (RIGHT SIDE) -->

  <!-- Start/Stop Cyber Button -->
  <g transform="translate(362, 75)">
    <rect x="0" y="0" width="55" height="35" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <rect x="4" y="4" width="47" height="27" rx="4" fill="#0d1117" />
    <text x="27.5" y="21" fill="#00f3ff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle" filter="url(#cyan-glow)">RUN</text>
    <circle cx="46" cy="9" r="2" fill="#00f3ff" filter="url(#cyan-glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Pitch Slider Module -->
  <g transform="translate(405, 140)">
    <rect x="0" y="0" width="20" height="140" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1" />
    <!-- Track Line -->
    <line x1="10" y1="15" x2="10" y2="125" stroke="#161b22" stroke-width="4" />
    <line x1="10" y1="15" x2="10" y2="125" stroke="#ff007f" stroke-width="1" opacity="0.5" />
    <!-- Pitch Scale Marks -->
    <path d="M 2 30 H 6 M 2 50 H 6 M 2 70 H 8 M 2 90 H 6 M 2 110 H 6" stroke="#8b949e" stroke-width="1" />
    <!-- Animated Fader Knob -->
    <g transform="translate(0, 45)">
      <animateTransform attributeName="transform" type="translate" values="0,30; 0,65; 0,20; 0,45" dur="8s" repeatCount="indefinite" />
      <rect x="-2" y="0" width="24" height="12" rx="2" fill="#30363d" stroke="#00f3ff" stroke-width="1" filter="url(#cyan-glow)" />
      <line x1="2" y1="6" x2="20" y2="6" stroke="#ffffff" stroke-width="1.5" />
    </g>
  </g>

  <!-- Digital Audio Visualizer Screen -->
  <g transform="translate(62, 392)">
    <!-- Screen Bezel -->
    <rect x="0" y="0" width="130" height="42" rx="4" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <!-- Screen Grid Overlay -->
    <rect x="3" y="3" width="124" height="36" fill="#010409" />
    
    <!-- EQ Bars (SMIL Animated Heights) -->
    <!-- Bar 1 -->
    <rect x="12" y="12" width="6" height="20" fill="#00f3ff" rx="1" filter="url(#cyan-glow)">
      <animate attributeName="height" values="8;22;12;25;8" dur="0.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="24;10;20;7;24" dur="0.8s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 2 -->
    <rect x="22" y="10" width="6" height="22" fill="#00f3ff" rx="1" filter="url(#cyan-glow)">
      <animate attributeName="height" values="18;8;24;10;18" dur="0.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="14;24;8;22;14" dur="0.6s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 3 -->
    <rect x="32" y="15" width="6" height="17" fill="#00f3ff" rx="1" filter="url(#cyan-glow)">
      <animate attributeName="height" values="22;14;6;26;22" dur="0.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="10;18;26;6;10" dur="0.7s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 4 -->
    <rect x="42" y="8" width="6" height="24" fill="#ff007f" rx="1" filter="url(#magenta-glow)">
      <animate attributeName="height" values="12;26;18;8;12" dur="0.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="20;6;14;24;20" dur="0.5s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 5 -->
    <rect x="52" y="18" width="6" height="14" fill="#ff007f" rx="1" filter="url(#magenta-glow)">
      <animate attributeName="height" values="24;10;22;15;24" dur="0.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="8;22;10;17;8" dur="0.9s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 6 -->
    <rect x="62" y="12" width="6" height="20" fill="#00f3ff" rx="1" filter="url(#cyan-glow)">
      <animate attributeName="height" values="10;20;14;26;10" dur="0.65s" repeatCount="indefinite" />
      <animate attributeName="y" values="22;12;18;6;22" dur="0.65s" repeatCount="indefinite" />
    </rect>
    
    <!-- Readout Telemetry Text -->
    <text x="76" y="18" fill="#00f3ff" font-family="monospace" font-size="7" font-weight="bold">BPM:128</text>
    <text x="76" y="28" fill="#ff007f" font-family="monospace" font-size="7" font-weight="bold">SYNC:OK</text>
    <text x="76" y="35" fill="#8b949e" font-family="monospace" font-size="5">CYBER-DECK</text>
  </g>

  <!-- Status Indicator LEDs -->
  <g transform="translate(210, 410)">
    <circle cx="0" cy="0" r="4" fill="#00f3ff" filter="url(#cyan-glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="15" cy="0" r="4" fill="#ff007f" filter="url(#magenta-glow)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="30" cy="0" r="4" fill="#30363d" />
  </g>

  <!-- FUTURISTIC TONEARM ASSEMBLY -->
  <g transform="translate(330, 360)">
    
    <!-- Tonearm Base / Pivot Ring -->
    <circle cx="0" cy="0" r="28" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <circle cx="0" cy="0" r="20" fill="#0d1117" stroke="#00f3ff" stroke-width="1" filter="url(#cyan-glow)" />
    <circle cx="0" cy="0" r="10" fill="url(#tonearm-grad)" />
    <circle cx="0" cy="0" r="4" fill="#00f3ff" />

    <!-- Entire Arm Group Swivel Motion (Vibrates subtly to simulate playing) -->
    <g transform="rotate(-28)">
      <animateTransform 
        attributeName="transform" 
        type="rotate" 
        values="-28; -27.3; -28" 
        dur="0.15s" 
        repeatCount="indefinite" />

      <!-- Main Boom (Angled Futuristic Segmented Arm) -->
      <!-- Segment 1: Base to Joint -->
      <path d="M -4 -10 L -3 -160 L 3 -160 L 4 -10 Z" fill="url(#tonearm-grad)" stroke="#161b22" stroke-width="1" />
      <line x1="0" y1="-15" x2="0" y2="-155" stroke="#ff007f" stroke-width="1" filter="url(#magenta-glow)" />

      <!-- Joint Module -->
      <rect x="-7" y="-167" width="14" height="14" rx="2" fill="#161b22" stroke="#00f3ff" stroke-width="1" />

      <!-- Segment 2: Angled Headpiece Section -->
      <path d="M -3 -167 L -18 -225 L -6 -227 L 3 -167 Z" fill="url(#tonearm-grad)" />
      <line x1="-1" y1="-167" x2="-13" y2="-223" stroke="#00f3ff" stroke-width="1" />

      <!-- Cartridge / Headshell (Robotic Styling) -->
      <g transform="translate(-15, -225) rotate(22)">
        <!-- Main Cartridge Block -->
        <rect x="-10" y="-24" width="20" height="26" rx="3" fill="#161b22" stroke="#30363d" stroke-width="1.5" />
        <!-- Accent Glow Plate -->
        <rect x="-7" y="-20" width="14" height="8" rx="1" fill="#ff007f" filter="url(#magenta-glow)" />
        <!-- Stylus Body -->
        <path d="M -5 -4 L 0 6 L 5 -4 Z" fill="#c9d1d9" />
        <!-- Needle Tip Light Laser -->
        <circle cx="0" cy="5" r="2" fill="#00f3ff" filter="url(#cyan-glow)">
          <animate attributeName="opacity" values="0.6;1;0.6" dur="0.2s" repeatCount="indefinite" />
        </circle>
        <!-- Laser Contact Point on Vinyl -->
        <ellipse cx="0" cy="7" rx="3" ry="1" fill="#00f3ff" filter="url(#cyan-glow)" opacity="0.8" />
      </g>
    </g>
  </g>
</svg>
