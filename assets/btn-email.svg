<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="5" y="5" width="190" height="50" rx="25" fill="#161b22" stroke="#CCFF00" stroke-width="2" filter="url(#glow)">
    <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" />
  </rect>
  <text x="100" y="35" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#CCFF00" text-anchor="middle">EMAIL ✉</text>
</svg>
