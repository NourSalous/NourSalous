<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220">
  <defs>
    <filter id="glow-v" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-l" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(110, 110)">
    <!-- Floating Animation -->
    <animateTransform attributeName="transform" type="translate" values="110,100; 110,120; 110,100" dur="6s" repeatCount="indefinite" />
    
    <!-- Rotating Group -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
      
      <!-- Outer Violet Ring -->
      <circle cx="0" cy="0" r="90" fill="none" stroke="#7000FF" stroke-width="1" stroke-dasharray="10 30" opacity="0.5" filter="url(#glow-v)"/>
      <circle cx="0" cy="0" r="80" fill="none" stroke="#7000FF" stroke-width="2" stroke-dasharray="80 40 20 40" opacity="0.8" filter="url(#glow-v)"/>
      
      <!-- Inner Lime Elements -->
      <circle cx="0" cy="0" r="60" fill="none" stroke="#CCFF00" stroke-width="1" stroke-dasharray="5 15" opacity="0.6" filter="url(#glow-l)">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite" />
      </circle>

      <!-- Isometric Cube Lines -->
      <g stroke-width="2" fill="none">
        <path d="M 0,-45 L 40,-20 L 40,25 L 0,50 L -40,25 L -40,-20 Z" stroke="#7000FF" filter="url(#glow-v)">
           <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
        </path>
        <path d="M 0,-45 L 0,0 L 40,25 M 0,0 L -40,25 M 0,50 L 0,0" stroke="#CCFF00" filter="url(#glow-l)">
           <animate attributeName="opacity" values="1;0.4;1" dur="3s" repeatCount="indefinite" />
        </path>
        
        <!-- Inner Core Diamond -->
        <path d="M 0,-15 L 15,0 L 0,15 L -15,0 Z" fill="#CCFF00" stroke="none" filter="url(#glow-l)">
          <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
</svg>
