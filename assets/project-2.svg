<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" width="100%" height="160">
  <defs>
    <filter id="neon" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="2" y="2" width="256" height="156" rx="12" fill="#0d1117" stroke="#CCFF00" stroke-width="1.5" filter="url(#neon)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite" />
  </rect>
  
  <path d="M 2 20 L 10 12 L 20 12" fill="none" stroke="#7000FF" stroke-width="2" />
  <path d="M 258 140 L 250 148 L 240 148" fill="none" stroke="#CCFF00" stroke-width="2" />
  
  <text x="20" y="35" font-family="Courier New, monospace" font-weight="bold" font-size="18" fill="#ffffff">Metatıp Auth</text>
  
  <text x="20" y="60" font-family="sans-serif" font-size="12" fill="#8b949e" width="220">
    <tspan x="20" dy="0">Independently engineered</tspan>
    <tspan x="20" dy="16">complete authentication</tspan>
    <tspan x="20" dy="16">and authorization engine.</tspan>
  </text>
  
  <g transform="translate(20, 115)">
    <rect x="0" y="0" width="40" height="20" rx="4" fill="#161b22" stroke="#CCFF00" stroke-width="1"/>
    <text x="20" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#CCFF00" text-anchor="middle">PHP</text>
    
    <rect x="50" y="0" width="60" height="20" rx="4" fill="#161b22" stroke="#7000FF" stroke-width="1"/>
    <text x="80" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#7000FF" text-anchor="middle">Security</text>
    
    <rect x="120" y="0" width="70" height="20" rx="4" fill="#161b22" stroke="#CCFF00" stroke-width="1"/>
    <text x="155" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#CCFF00" text-anchor="middle">REST APIs</text>
  </g>
</svg>
