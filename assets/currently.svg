<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241a12" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#140d08" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c987" />
      <stop offset="55%" stop-color="#e0a458" />
      <stop offset="100%" stop-color="#d2695f" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <pattern id="dot" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#f2e8da" opacity="0.04" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#dot)" />

  <rect x="25" y="25" width="800" height="250" rx="16" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="2" />

  <rect x="25" y="25" width="800" height="250" rx="16" fill="none" stroke="#e0a458" stroke-width="2" stroke-dasharray="100 2000" stroke-dashoffset="0" opacity="0.7" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="2100; 0" dur="8s" repeatCount="indefinite" />
  </rect>

  <g transform="translate(60, 60)">
    <circle cx="20" cy="20" r="20" fill="#e0a458" opacity="0.12" />
    <path d="M 12 20 L 20 12 L 28 20 L 20 28 Z" fill="#e0a458" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="0 20 20; 360 20 20" dur="10s" repeatCount="indefinite" />
    </path>
    <text x="60" y="15" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#f2e8da">AI Study Platform</text>
    <text x="60" y="38" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="14" fill="#b8a58f">Co-founding an advanced EdTech intelligence system.</text>
  </g>

  <rect x="60" y="125" width="730" height="1" fill="#3a2c20" />

  <g transform="translate(60, 150)">
    <circle cx="20" cy="20" r="20" fill="#d2695f" opacity="0.12" />
    <polygon points="20,10 28,25 12,25" fill="#d2695f" filter="url(#glow)">
      <animateTransform attributeName="transform" type="scale" values="1; 1.2; 1" cx="20" cy="20" dur="3s" repeatCount="indefinite" />
    </polygon>
    <text x="60" y="15" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#f2e8da">Immersive AR-Web</text>
    <text x="60" y="38" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="14" fill="#b8a58f">Engineering high-performance 3D spatial computing for browsers.</text>
  </g>

  <rect x="60" y="215" width="730" height="1" fill="#3a2c20" />

  <g transform="translate(60, 240)">
    <circle cx="20" cy="20" r="20" fill="#f0c987" opacity="0.12" />
    <rect x="14" y="14" width="12" height="12" fill="#f0c987" filter="url(#glow)">
       <animateTransform attributeName="transform" type="rotate" values="0 20 20; -360 20 20" dur="8s" repeatCount="indefinite" />
    </rect>
    <text x="60" y="15" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#f2e8da">EEG-based ML Models</text>
    <text x="60" y="38" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="14" fill="#b8a58f">Publishing and deploying neuro-technology research into production.</text>
  </g>

</svg>
