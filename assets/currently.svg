<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 300" width="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121220" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#08080f" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFF9" />
      <stop offset="50%" stop-color="#B829F7" />
      <stop offset="100%" stop-color="#FF00E5" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Grid (Optional Subtle Backdrop) -->
  <pattern id="dot" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#FFFFFF" opacity="0.05" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#dot)" />

  <!-- Main Card Container -->
  <rect x="25" y="25" width="800" height="250" rx="16" fill="url(#cardBg)" stroke="url(#borderGrad)" stroke-width="2" />
  
  <!-- Animated Edge Highlight -->
  <rect x="25" y="25" width="800" height="250" rx="16" fill="none" stroke="#00FFF9" stroke-width="2" stroke-dasharray="100 2000" stroke-dashoffset="0" opacity="0.8" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="2100; 0" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- Section 1: AI Platform -->
  <g transform="translate(60, 60)">
    <circle cx="20" cy="20" r="20" fill="#00FFF9" opacity="0.1" />
    <path d="M 12 20 L 20 12 L 28 20 L 20 28 Z" fill="#00FFF9" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="0 20 20; 360 20 20" dur="10s" repeatCount="indefinite" />
    </path>
    <text x="60" y="15" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#E8E8F0">AI Study Platform</text>
    <text x="60" y="38" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="14" fill="#A0A0C0">Co-founding an advanced EdTech intelligence system.</text>
  </g>

  <!-- Divider Line -->
  <rect x="60" y="125" width="730" height="1" fill="#2A2A3E" />

  <!-- Section 2: AR / Web Experiences -->
  <g transform="translate(60, 150)">
    <circle cx="20" cy="20" r="20" fill="#B829F7" opacity="0.1" />
    <polygon points="20,10 28,25 12,25" fill="#B829F7" filter="url(#glow)">
      <animateTransform attributeName="transform" type="scale" values="1; 1.2; 1" cx="20" cy="20" dur="3s" repeatCount="indefinite" />
    </polygon>
    <text x="60" y="15" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#E8E8F0">Immersive AR-Web</text>
    <text x="60" y="38" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="14" fill="#A0A0C0">Engineering high-performance 3D spatial computing for browsers.</text>
  </g>

  <!-- Divider Line -->
  <rect x="60" y="215" width="730" height="1" fill="#2A2A3E" />

  <!-- Section 3: ML Research -->
  <g transform="translate(60, 240)">
    <circle cx="20" cy="20" r="20" fill="#FF00E5" opacity="0.1" />
    <rect x="14" y="14" width="12" height="12" fill="#FF00E5" filter="url(#glow)">
       <animateTransform attributeName="transform" type="rotate" values="0 20 20; -360 20 20" dur="8s" repeatCount="indefinite" />
    </rect>
    <text x="60" y="15" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="20" fill="#E8E8F0">EEG-based ML Models</text>
    <text x="60" y="38" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="400" font-size="14" fill="#A0A0C0">Publishing and deploying neuro-technology research into production.</text>
  </g>

</svg>