<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 310" width="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#060913" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ff2bd6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <pattern id="dot" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#38bdf8" opacity="0.08" />
  </pattern>
  <rect width="100%" height="100%" fill="url(#dot)" />

  <rect x="25" y="15" width="800" height="280" rx="16" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" />

  <rect x="25" y="15" width="800" height="280" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-dasharray="120 2000" stroke-dashoffset="0" opacity="0.8" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="2120; 0" dur="8s" repeatCount="indefinite" />
  </rect>

  <!-- Item 1: Mentara AI Platform -->
  <g transform="translate(60, 42)">
    <circle cx="20" cy="20" r="20" fill="#00f0ff" opacity="0.14" />
    <path d="M 12 20 L 20 12 L 28 20 L 20 28 Z" fill="#00f0ff" filter="url(#glow)">
      <animateTransform attributeName="transform" type="rotate" values="0 20 20; 360 20 20" dur="10s" repeatCount="indefinite" />
    </path>
    <text x="60" y="15" font-family="'Orbitron', 'Inter', sans-serif" font-weight="700" font-size="18" fill="#f8fafc">Mentara — AI-Powered Study Platform</text>
    <text x="60" y="38" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#94a3b8">Co-founding &amp; architecting end-to-end: RAG pipelines, pgvector, NestJS &amp; LLM agents.</text>
  </g>

  <line x1="60" y1="118" x2="790" y2="118" stroke="#1e293b" stroke-width="1" />

  <!-- Item 2: MetaTip AR-Web -->
  <g transform="translate(60, 134)">
    <circle cx="20" cy="20" r="20" fill="#a855f7" opacity="0.14" />
    <polygon points="20,10 28,25 12,25" fill="#a855f7" filter="url(#glow)">
      <animateTransform attributeName="transform" type="scale" values="1; 1.2; 1" cx="20" cy="20" dur="3s" repeatCount="indefinite" />
    </polygon>
    <text x="60" y="15" font-family="'Orbitron', 'Inter', sans-serif" font-weight="700" font-size="18" fill="#f8fafc">MetaTıp — Immersive AR-Web Platform</text>
    <text x="60" y="38" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#94a3b8">Sole engineer for metatip3d.com.tr: Three.js raycasting, WebXR anatomy explorer &amp; secure JWT auth.</text>
  </g>

  <line x1="60" y1="210" x2="790" y2="210" stroke="#1e293b" stroke-width="1" />

  <!-- Item 3: Clinical ML Research -->
  <g transform="translate(60, 226)">
    <circle cx="20" cy="20" r="20" fill="#00ffa3" opacity="0.14" />
    <rect x="14" y="14" width="12" height="12" fill="#00ffa3" filter="url(#glow)">
       <animateTransform attributeName="transform" type="rotate" values="0 20 20; -360 20 20" dur="8s" repeatCount="indefinite" />
    </rect>
    <text x="60" y="15" font-family="'Orbitron', 'Inter', sans-serif" font-weight="700" font-size="18" fill="#f8fafc">MIRAI Lab — EEG Neuro-AI Research</text>
    <text x="60" y="38" font-family="'Inter', sans-serif" font-weight="400" font-size="13.5" fill="#94a3b8">Co-authored ADHD classification study (77 subjects, 1185 features, XGBoost, SHAP on medRxiv).</text>
  </g>
</svg>
