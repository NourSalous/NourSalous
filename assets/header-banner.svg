<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 300" width="100%" role="img" aria-label="Nour Salous - Full-Stack and AI Engineer">
  <defs>
    <!-- Neon palette -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a12"/>
      <stop offset="50%" stop-color="#101022"/>
      <stop offset="100%" stop-color="#0a0a12"/>
    </linearGradient>

    <!-- Animated aurora gradient for shimmer -->
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#7b3bff;#00f0ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#35ff9e">
        <animate attributeName="stop-color" values="#35ff9e;#00f0ff;#35ff9e" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7b3bff">
        <animate attributeName="stop-color" values="#7b3bff;#35ff9e;#7b3bff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#7b3bff;#00f0ff" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#35ff9e">
        <animate attributeName="stop-color" values="#35ff9e;#7b3bff;#35ff9e" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Soft glow filters (glassmorphism bloom) -->
    <filter id="blurGlass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#00f0ff" flood-opacity="0.85"/>
    </filter>
    <filter id="glowGreen" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#35ff9e" flood-opacity="0.85"/>
    </filter>

    <radialGradient id="orbCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbMag" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b3bff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#7b3bff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" fill="url(#bgGrad)" rx="28"/>

  <!-- Floating blurred glass orbs (glassmorphism) -->
  <circle cx="120" cy="60" r="120" fill="url(#orbCyan)" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="880" cy="230" r="130" fill="url(#orbMag)" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="9s" repeatCount="indefinite" begin="1.5s"/>
  </circle>

  <!-- Moving neon particles / dots -->
  <g>
    <circle cx="80" cy="70" r="2.5" fill="#00f0ff" filter="url(#glowCyan)">
      <animate attributeName="cy" values="70;230;70" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="240" r="2" fill="#35ff9e" filter="url(#glowGreen)">
      <animate attributeName="cx" values="220;700;220" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="240;80;240" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="760" cy="90" r="2.5" fill="#7b3bff" filter="url(#glowCyan)">
      <animate attributeName="cy" values="90;220;90" dur="8s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="520" cy="40" r="2" fill="#00f0ff" filter="url(#glowCyan)">
      <animate attributeName="cy" values="40;250;40" dur="12s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>

  <!-- Shimmer line above -->
  <line x1="0" y1="2" x2="1000" y2="2" stroke="url(#aurora)" stroke-width="3" opacity="0.9"/>

  <!-- Central glass panel -->
  <g transform="translate(500,150)">
    <rect x="-440" y="-120" width="880" height="240" rx="24" fill="#0c0c18" fill-opacity="0.35" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1.2" filter="url(#blurGlass)"/>
  </g>

  <!-- Name -->
  <text x="500" y="150" text-anchor="middle" font-family="Orbitron, 'Arial Black', Arial, sans-serif" font-weight="800" font-size="74" letter-spacing="3" fill="url(#aurora)" filter="url(#glowCyan)">NOUR&#160;SALOUS</text>

  <!-- Skinny accent rule -->
  <line x1="300" y1="196" x2="700" y2="196" stroke="url(#aurora)" stroke-width="2" stroke-linecap="round"/>

  <!-- Tagline -->
  <text x="500" y="232" text-anchor="middle" font-family="Rajdhani, Verdana, sans-serif" font-weight="600" font-size="24" letter-spacing="6" fill="#eae8ff" fill-opacity="0.92">FULL&#8209;STACK&#160;·&#160;APPLIED&#160;AI&#160;·&#160;AR/3D&#160;WEB</text>

  <!-- Bottom border shimmer -->
  <rect x="0" y="298" width="1000" height="2" fill="url(#aurora)" opacity="0.8"/>
</svg>