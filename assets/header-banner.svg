<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" role="img" aria-label="Nour Salous - Full-Stack and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07070f"/>
      <stop offset="40%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#07070f"/>
    </linearGradient>

    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff">
        <animate attributeName="stop-color" values="#00f0ff;#7b3bff;#00f0ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#35ff9e">
        <animate attributeName="stop-color" values="#35ff9e;#00f0ff;#35ff9e" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7b3bff">
        <animate attributeName="stop-color" values="#7b3bff;#35ff9e;#7b3bff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1000 0" dur="14s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="glassFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#7b3bff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#35ff9e" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="innerHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="8%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="92%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <filter id="blurHeavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <filter id="blurSoft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#00f0ff" flood-opacity="0.9"/>
    </filter>
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#35ff9e" flood-opacity="0.8"/>
    </filter>
    <filter id="glowViolet" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#7b3bff" flood-opacity="0.8"/>
    </filter>
    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#00f0ff" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#7b3bff" flood-opacity="0.4"/>
    </filter>

    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b3bff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7b3bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#35ff9e" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#35ff9e" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="glassClip">
      <rect x="80" y="40" width="840" height="240" rx="32"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1000" height="320" fill="url(#bg)" rx="28"/>

  <!-- Large ambient orbs behind everything (blurred) -->
  <circle cx="150" cy="80" r="160" fill="url(#orb1)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;120;80" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="850" cy="250" r="170" fill="url(#orb2)" opacity="0">
    <animate attributeName="opacity" values="0;1;0" dur="10s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="cy" values="250;200;250" dur="10s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle cx="500" cy="40" r="100" fill="url(#orb3)" opacity="0">
    <animate attributeName="opacity" values="0;0.8;0" dur="8s" repeatCount="indefinite" begin="4s"/>
  </circle>

  <!-- Floating glass shards -->
  <g opacity="0.5">
    <rect x="60" y="100" width="50" height="18" rx="9" fill="#00f0ff" fill-opacity="0.08" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="0.8" transform="rotate(-15 85 109)">
      <animateTransform attributeName="transform" type="translate" values="0 0;10 -20;0 0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="880" y="70" width="40" height="14" rx="7" fill="#7b3bff" fill-opacity="0.08" stroke="#7b3bff" stroke-opacity="0.2" stroke-width="0.8" transform="rotate(20 900 77)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-12 15;0 0" dur="9s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="9s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <rect x="750" y="260" width="55" height="16" rx="8" fill="#35ff9e" fill-opacity="0.06" stroke="#35ff9e" stroke-opacity="0.18" stroke-width="0.8" transform="rotate(-8 777 268)">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 -12;0 0" dur="11s" repeatCount="indefinite" begin="3s"/>
    </rect>
    <rect x="130" y="250" width="35" height="12" rx="6" fill="#00f0ff" fill-opacity="0.07" stroke="#00f0ff" stroke-opacity="0.15" stroke-width="0.8" transform="rotate(30 147 256)">
      <animateTransform attributeName="transform" type="translate" values="0 0;-6 10;0 0" dur="8s" repeatCount="indefinite" begin="2s"/>
    </rect>
    <circle cx="920" cy="180" r="6" fill="#7b3bff" fill-opacity="0.1" stroke="#7b3bff" stroke-opacity="0.25" stroke-width="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;-10 -8;0 0" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;1;0.4" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="45" cy="200" r="5" fill="#35ff9e" fill-opacity="0.1" stroke="#35ff9e" stroke-opacity="0.2" stroke-width="0.8">
      <animateTransform attributeName="transform" type="translate" values="0 0;8 -6;0 0" dur="7.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <!-- Constellation particles with trails -->
  <g>
    <circle cx="80" cy="60" r="2.5" fill="#00f0ff" filter="url(#glowCyan)">
      <animate attributeName="cy" values="60;260;60" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="80;120;80" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.15;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="250" r="2" fill="#35ff9e" filter="url(#glowGreen)">
      <animate attributeName="cx" values="200;750;200" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="250;60;250" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0.1;0.8" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="80" r="2.5" fill="#7b3bff" filter="url(#glowViolet)">
      <animate attributeName="cy" values="80;240;80" dur="9s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="cx" values="780;720;780" dur="9s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="500" cy="30" r="1.8" fill="#00f0ff" filter="url(#glowCyan)">
      <animate attributeName="cy" values="30;280;30" dur="13s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="13s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="920" cy="150" r="2" fill="#35ff9e" filter="url(#glowGreen)">
      <animate attributeName="cy" values="150;50;150" dur="8s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="cx" values="920;870;920" dur="8s" repeatCount="indefinite" begin="3s"/>
    </circle>
    <circle cx="350" cy="290" r="1.5" fill="#7b3bff" filter="url(#glowViolet)">
      <animate attributeName="cy" values="290;40;290" dur="11s" repeatCount="indefinite" begin="5s"/>
      <animate attributeName="cx" values="350;400;350" dur="11s" repeatCount="indefinite" begin="5s"/>
    </circle>
  </g>

  <!-- Sparkle crosshairs (whimsy) -->
  <g opacity="0.6">
    <g transform="translate(160,120)">
      <line x1="-8" y1="0" x2="8" y2="0" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="0" y1="-8" x2="0" y2="8" stroke="#00f0ff" stroke-width="1.2" stroke-linecap="round"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(840,200)">
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#35ff9e" stroke-width="1" stroke-linecap="round"/>
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#35ff9e" stroke-width="1" stroke-linecap="round"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="5s" repeatCount="indefinite" begin="1.5s"/>
    </g>
    <g transform="translate(420,270)">
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#7b3bff" stroke-width="1" stroke-linecap="round"/>
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#7b3bff" stroke-width="1" stroke-linecap="round"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="6s" repeatCount="indefinite" begin="3s"/>
    </g>
    <g transform="translate(680,60)">
      <line x1="-7" y1="0" x2="7" y2="0" stroke="#00f0ff" stroke-width="1" stroke-linecap="round"/>
      <line x1="0" y1="-7" x2="0" y2="7" stroke="#00f0ff" stroke-width="1" stroke-linecap="round"/>
      <animate attributeName="opacity" values="0;0.85;0" dur="4.5s" repeatCount="indefinite" begin="2s"/>
    </g>
  </g>

  <!-- ===== GLASSMORPHISM CARD ===== -->

  <!-- Card blurred backdrop glow -->
  <rect x="80" y="40" width="840" height="240" rx="32" fill="#0e0e1e" fill-opacity="0.6" filter="url(#blurHeavy)"/>

  <!-- Card body: frosted glass fill -->
  <rect x="80" y="40" width="840" height="240" rx="32" fill="url(#glassFill)" stroke="url(#glassBorder)" stroke-width="1.5"/>

  <!-- Inner specular highlight (top edge shine) -->
  <rect x="80" y="40" width="840" height="240" rx="32" fill="url(#innerHighlight)" clip-path="url(#glassClip)"/>

  <!-- Subtle inner glass reflections -->
  <line x1="90" y1="55" x2="350" y2="55" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" stroke-linecap="round"/>
  <line x1="650" y1="265" x2="910" y2="265" stroke="#ffffff" stroke-opacity="0.05" stroke-width="0.8" stroke-linecap="round"/>

  <!-- ===== TEXT ===== -->

  <!-- Name with layered glow -->
  <text x="500" y="165" text-anchor="middle" font-family="Orbitron, 'Segoe UI Black', Arial, sans-serif" font-weight="800" font-size="78" letter-spacing="5" fill="url(#aurora)" filter="url(#glowText)">NOUR&#160;SALOUS</text>

  <!-- Accent rule with glow -->
  <line x1="280" y1="200" x2="720" y2="200" stroke="url(#aurora)" stroke-width="2" stroke-linecap="round" filter="url(#blurSoft)"/>
  <line x1="320" y1="200" x2="680" y2="200" stroke="url(#aurora)" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>

  <!-- Tagline -->
  <text x="500" y="240" text-anchor="middle" font-family="Rajdhani, 'Segoe UI', Verdana, sans-serif" font-weight="600" font-size="22" letter-spacing="7" fill="#eae8ff" fill-opacity="0.8">FULL&#8209;STACK&#160;·&#160;APPLIED&#160;AI&#160;·&#160;AR&#47;3D&#160;WEB</text>

  <!-- ===== BORDERS ===== -->

  <!-- Top shimmer line -->
  <line x1="0" y1="2" x2="1000" y2="2" stroke="url(#aurora)" stroke-width="2.5" opacity="0.85"/>

  <!-- Bottom shimmer line -->
  <line x1="0" y1="318" x2="1000" y2="318" stroke="url(#aurora)" stroke-width="2.5" opacity="0.7"/>
</svg>