<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360" role="img" aria-label="Nour Salous Repo Galaxy">
  <defs>
    <!-- Cosmic Space Gradient -->
    <linearGradient id="spaceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="45%" stop-color="#0a1128" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="megaGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nebulaBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" />
    </filter>

    <!-- Planetary Gradients -->
    <radialGradient id="sunCore" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#7dd3fc" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>

    <radialGradient id="mentaraPlanet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#083344" />
    </radialGradient>

    <radialGradient id="miraiPlanet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#064e3b" />
    </radialGradient>

    <radialGradient id="metatipPlanet" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b0764" />
    </radialGradient>

    <radialGradient id="arcadeMoon" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#ff2bd6" />
      <stop offset="100%" stop-color="#831843" />
    </radialGradient>

    <linearGradient id="orbitalBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="33%" stop-color="#a855f7" />
      <stop offset="66%" stop-color="#ff2bd6" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>

    <!-- Stardust Pattern -->
    <pattern id="stardust" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="20" r="0.8" fill="#ffffff" opacity="0.4" />
      <circle cx="65" cy="55" r="0.6" fill="#7dd3fc" opacity="0.5" />
      <circle cx="45" cy="75" r="0.9" fill="#c084fc" opacity="0.4" />
      <circle cx="70" cy="15" r="0.7" fill="#ffffff" opacity="0.3" />
    </pattern>
  </defs>

  <!-- Deep Cosmos Background -->
  <rect width="100%" height="100%" rx="18" fill="url(#spaceBg)" />
  <rect width="100%" height="100%" rx="18" fill="url(#stardust)" />

  <!-- Outer Laser Stroke -->
  <rect x="1.5" y="1.5" width="877" height="357" rx="17" fill="none" stroke="url(#orbitalBorder)" stroke-width="1.8" stroke-dasharray="140 1800" opacity="0.85" filter="url(#starGlow)">
    <animate attributeName="stroke-dashoffset" values="1940; 0" dur="9s" repeatCount="indefinite" />
  </rect>

  <!-- Glowing Colorful Nebulae Clouds -->
  <ellipse cx="220" cy="160" rx="180" ry="110" fill="#00f0ff" opacity="0.07" filter="url(#nebulaBlur)" />
  <ellipse cx="640" cy="180" rx="200" ry="120" fill="#a855f7" opacity="0.08" filter="url(#nebulaBlur)" />
  <ellipse cx="440" cy="240" rx="140" ry="80" fill="#ff2bd6" opacity="0.06" filter="url(#nebulaBlur)" />
  <ellipse cx="720" cy="90" rx="100" ry="60" fill="#10b981" opacity="0.06" filter="url(#nebulaBlur)" />

  <!-- Twinkling Constellation Stars -->
  <g>
    <!-- Constellation lines -->
    <line x1="75" y1="85" x2="135" y2="60" stroke="#38bdf8" stroke-width="1" opacity="0.3" stroke-dasharray="3 3" />
    <line x1="135" y1="60" x2="185" y2="105" stroke="#38bdf8" stroke-width="1" opacity="0.3" stroke-dasharray="3 3" />
    <line x1="720" y1="65" x2="780" y2="115" stroke="#c084fc" stroke-width="1" opacity="0.3" stroke-dasharray="3 3" />
    <line x1="780" y1="115" x2="825" y2="75" stroke="#c084fc" stroke-width="1" opacity="0.3" stroke-dasharray="3 3" />

    <circle cx="75" cy="85" r="2" fill="#ffffff" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="135" cy="60" r="2.5" fill="#38bdf8" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.9; 0.2; 0.9" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="185" cy="105" r="2" fill="#ffffff" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite" />
    </circle>

    <circle cx="720" cy="65" r="2.5" fill="#c084fc" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.8; 0.3; 0.8" dur="2.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="780" cy="115" r="2" fill="#ffffff" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="1.9s" repeatCount="indefinite" />
    </circle>
    <circle cx="825" cy="75" r="2.8" fill="#f472b6" filter="url(#starGlow)">
      <animate attributeName="opacity" values="0.9; 0.3; 0.9" dur="3.5s" repeatCount="indefinite" />
    </circle>

    <!-- Whimsical Shooting Star -->
    <path d="M 60 40 L 140 90" stroke="url(#orbitalBorder)" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.9; 0" keyTimes="0; 0.6; 0.7; 1" dur="7s" repeatCount="indefinite" />
      <animate attributeName="d" values="M 40 20 L 120 70; M 120 70 L 200 120; M 200 120 L 280 170" dur="7s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Orbital Rings around Center -->
  <g transform="translate(440, 165)">
    <!-- Ring 1 (Inner) -->
    <ellipse cx="0" cy="0" rx="140" ry="48" fill="none" stroke="#00f0ff" stroke-width="1.2" stroke-dasharray="6 8" opacity="0.35" transform="rotate(-14)" />
    
    <!-- Ring 2 (Middle) -->
    <ellipse cx="0" cy="0" rx="230" ry="76" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="8 10" opacity="0.3" transform="rotate(-10)" />

    <!-- Ring 3 (Outer) -->
    <ellipse cx="0" cy="0" rx="330" ry="105" fill="none" stroke="#ff2bd6" stroke-width="1" stroke-dasharray="10 14" opacity="0.22" transform="rotate(-6)" />
  </g>

  <!-- Planetary Celestial Bodies -->

  <!-- Planet 1: Mentara Prime (Left - AI & RAG Engine) -->
  <g transform="translate(200, 130)">
    <!-- Planetary rings -->
    <ellipse cx="0" cy="0" rx="42" ry="12" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" transform="rotate(-22)" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="24" fill="url(#mentaraPlanet)" filter="url(#starGlow)" />
    <ellipse cx="0" cy="0" rx="42" ry="12" fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.75" stroke-dasharray="65 100" transform="rotate(-22)" />
    <!-- Label -->
    <rect x="-48" y="32" width="96" height="20" rx="10" fill="#081022" stroke="#00f0ff" stroke-width="1" opacity="0.9" />
    <text x="0" y="46" font-family="'Orbitron', sans-serif" font-weight="700" font-size="9" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">MENTARA · AI</text>
  </g>

  <!-- Planet 2: MetaTıp 3D Spatial Sphere (Right - Spatial AR) -->
  <g transform="translate(670, 140)">
    <!-- Orbiting crystal moon -->
    <circle cx="0" cy="0" r="26" fill="url(#metatipPlanet)" filter="url(#starGlow)" />
    <!-- 3D wireframe arc -->
    <ellipse cx="0" cy="0" rx="26" ry="11" fill="none" stroke="#e9d5ff" stroke-width="1" opacity="0.6" transform="rotate(35)" />
    <ellipse cx="0" cy="0" rx="11" ry="26" fill="none" stroke="#e9d5ff" stroke-width="1" opacity="0.6" transform="rotate(35)" />
    <!-- Mini moon -->
    <circle cx="34" cy="-22" r="5" fill="#f472b6" filter="url(#starGlow)">
      <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="8s" repeatCount="indefinite" />
    </circle>
    <!-- Label -->
    <rect x="-54" y="34" width="108" height="20" rx="10" fill="#140826" stroke="#a855f7" stroke-width="1" opacity="0.9" />
    <text x="0" y="48" font-family="'Orbitron', sans-serif" font-weight="700" font-size="9" fill="#c084fc" text-anchor="middle" letter-spacing="1">METATIP · 3D AR</text>
  </g>

  <!-- Planet 3: MIRAI Neuro-Bio Sphere (Upper Right - Clinical ML) -->
  <g transform="translate(540, 75)">
    <circle cx="0" cy="0" r="18" fill="url(#miraiPlanet)" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="24" fill="none" stroke="#34d399" stroke-width="1.2" opacity="0.5" stroke-dasharray="4 4">
      <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="12s" repeatCount="indefinite" />
    </circle>
    <!-- Label -->
    <rect x="-42" y="24" width="84" height="18" rx="9" fill="#041a13" stroke="#10b981" stroke-width="1" opacity="0.9" />
    <text x="0" y="36.5" font-family="'Orbitron', sans-serif" font-weight="700" font-size="8" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">MIRAI · EEG ML</text>
  </g>

  <!-- Planet 4: Cyber Arcade Moon (Lower Left - Connect 4) -->
  <g transform="translate(320, 235)">
    <circle cx="0" cy="0" r="15" fill="url(#arcadeMoon)" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="20" fill="none" stroke="#ff2bd6" stroke-width="1.2" opacity="0.6" stroke-dasharray="5 5">
      <animateTransform attributeName="transform" type="rotate" values="360; 0" dur="10s" repeatCount="indefinite" />
    </circle>
    <rect x="-44" y="20" width="88" height="18" rx="9" fill="#1f0717" stroke="#ff2bd6" stroke-width="1" opacity="0.9" />
    <text x="0" y="32.5" font-family="'Orbitron', sans-serif" font-weight="700" font-size="8" fill="#f472b6" text-anchor="middle" letter-spacing="1">CONNECT 4 🔴</text>
  </g>

  <!-- CENTRAL SUN: The Developer Core Station (Nour Salous Hub) -->
  <g transform="translate(440, 160)">
    <!-- Corona Pulse -->
    <circle cx="0" cy="0" r="54" fill="#00f0ff" opacity="0.12" filter="url(#megaGlow)">
      <animate attributeName="r" values="50; 58; 50" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Star Core -->
    <circle cx="0" cy="0" r="42" fill="url(#sunCore)" filter="url(#starGlow)" />

    <!-- Inner Core Grid -->
    <circle cx="0" cy="0" r="34" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
    
    <!-- Code Glyph inside Sun -->
    <text x="0" y="8" font-family="'JetBrains Mono', monospace" font-weight="800" font-size="22" fill="#031525" text-anchor="middle">&lt;NS /&gt;</text>
  </g>

  <!-- Title & Top Telemetry Header -->
  <g transform="translate(440, 38)">
    <text x="0" y="0" font-family="'Orbitron', sans-serif" font-weight="900" font-size="19" fill="#f8fafc" text-anchor="middle" letter-spacing="4">
      NOUR SALOUS · REPO GALAXY
    </text>
    <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
      COSMIC ARCHITECTURE · APPLIED AI · FULL-STACK NEBULAE
    </text>
  </g>

  <!-- Bottom Telemetry HUD Ribbon -->
  <g transform="translate(440, 328)">
    <rect x="-370" y="-14" width="740" height="28" rx="14" fill="#080e22" stroke="#1e293b" stroke-width="1.2" />
    <text x="0" y="4" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">
      ★ 2,115+ CONTRIBUTIONS · 286-DAY ORBITAL STREAK · 3.94 GPA HIGH HONORS · 8 REPOSITORIES ★
    </text>
  </g>
</svg>
