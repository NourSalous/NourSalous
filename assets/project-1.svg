<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 160" width="100%" height="160">
  <defs>
    <filter id="neon" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect x="2" y="2" width="256" height="156" rx="12" fill="#0a0e14" stroke="#00f3ff" stroke-width="1.5" filter="url(#neon)">
    <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
  </rect>
  
  <!-- Cyber Cutouts -->
  <path d="M 2 20 L 10 12 L 20 12" fill="none" stroke="#ff007f" stroke-width="2" />
  <path d="M 258 140 L 250 148 L 240 148" fill="none" stroke="#00f3ff" stroke-width="2" />
  
  <text x="20" y="35" font-family="Courier New, monospace" font-weight="bold" font-size="18" fill="#ffffff">Mentara</text>
  
  <text x="20" y="60" font-family="sans-serif" font-size="12" fill="#8b949e" width="220">
    <tspan x="20" dy="0">Web-based AI learning</tspan>
    <tspan x="20" dy="16">platform featuring automated</tspan>
    <tspan x="20" dy="16">lecture-to-study pipelines.</tspan>
  </text>
  
  <!-- Tech Pills -->
  <g transform="translate(20, 115)">
    <rect x="0" y="0" width="55" height="20" rx="4" fill="#161b22" stroke="#00f3ff" stroke-width="1"/>
    <text x="27.5" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00f3ff" text-anchor="middle">React</text>
    
    <rect x="65" y="0" width="60" height="20" rx="4" fill="#161b22" stroke="#ff007f" stroke-width="1"/>
    <text x="95" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ff007f" text-anchor="middle">Node.js</text>
    
    <rect x="135" y="0" width="50" height="20" rx="4" fill="#161b22" stroke="#00f3ff" stroke-width="1"/>
    <text x="160" y="14" font-family="sans-serif" font-size="10" font-weight="bold" fill="#00f3ff" text-anchor="middle">RAG</text>
  </g>
</svg>
